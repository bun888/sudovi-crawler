name: Daily Crawl

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test authoritative DNS
        run: |
          echo "=== AUTHORITATIVE DNS 1 ==="
          dig @dns.pravosudje.hr odluke.sudovi.hr A || true

          echo "=== AUTHORITATIVE DNS 2 ==="
          dig @dns2.pravosudje.hr odluke.sudovi.hr A || true

          echo "=== AUTHORITATIVE SOA ==="
          dig @dns.pravosudje.hr sudovi.hr SOA || true

      - name: Test DNS
        run: |
          echo "=== SYSTEM DNS ==="
          getent hosts odluke.sudovi.hr || true

          echo "=== CLOUDFLARE ==="
          nslookup odluke.sudovi.hr 1.1.1.1 || true

          echo "=== GOOGLE ==="
          nslookup odluke.sudovi.hr 8.8.8.8 || true

          echo "=== QUAD9 ==="
          nslookup odluke.sudovi.hr 9.9.9.9 || true

          echo "=== CURL ==="
          curl -I --max-time 20 https://odluke.sudovi.hr/ || true

      - name: Run crawler
        run: |
          python crawler.py

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add state.json
          git add results_*.md

          git diff --cached --quiet || git commit -m "Daily crawl"

          git push
