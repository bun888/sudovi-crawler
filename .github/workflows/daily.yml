name: Daily Crawl

on:
  schedule:
  - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
    
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
    
      - name: Check DNS
        id: dns_check
        continue-on-error: true
        run: |
          echo "=== SYSTEM DNS ==="
          getent hosts odluke.sudovi.hr
    
      - name: Use fallback IP
        if: steps.dns_check.outcome != 'success'
        run: |
          echo "DNS resolution failed."
          echo "Using fallback IP 85.209.13.121"
    
          echo "85.209.13.121 odluke.sudovi.hr" | sudo tee -a /etc/hosts
    
          echo "=== HOSTS ENTRY ==="
          getent hosts odluke.sudovi.hr
    
      - name: Network diagnostics
        run: |
          echo "=== DATE ==="
          date -u
    
          echo "=== DNS RESULT ==="
          getent hosts odluke.sudovi.hr || true
    
          echo "=== HTTPS TEST ==="
          curl -I --max-time 20 https://odluke.sudovi.hr/ || true
    
          echo "=== DIRECT IP TEST ==="
          curl -I --max-time 20 \
            --resolve odluke.sudovi.hr:443:85.209.13.121 \
            https://odluke.sudovi.hr/ || true
    
      - name: Run crawler
        run: |
          python crawler.py
    
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
    
          git add state.json
          git add results_*.md
    
          git diff --cached --quiet || git commit -m "Daily crawl"
    
          git push
